[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mcp-guard"
version = "0.1.0-alpha.1"
description = "A read-only lifecycle auditor for MCP helpers correlated with Codex subagents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jesse Vale" }]
keywords = ["codex", "mcp", "subagent", "process", "lifecycle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/XJM-free/codex-mcp-guard"
Repository = "https://github.com/XJM-free/codex-mcp-guard"
Issues = "https://github.com/XJM-free/codex-mcp-guard/issues"

[project.scripts]
codex-mcp-guard = "codex_mcp_guard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
